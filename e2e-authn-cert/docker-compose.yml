services:
  conjur-mock:
    image: python:3.12-slim
    command: python /app/conjur-mock.py
    environment:
      PORT: "8080"
    volumes:
      - ./docker/conjur-mock.py:/app/conjur-mock.py:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 2s
      timeout: 2s
      retries: 10

  conjur-proxy:
    image: nginx:1.27-alpine
    ports:
      - "9443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      conjur-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:443/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
