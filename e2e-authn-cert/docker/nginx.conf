server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate         /etc/nginx/certs/server.pem;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/ca.pem;
    ssl_verify_client       on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /authn-cert/ {
        proxy_pass http://conjur-mock:8080;

        # Pass the client certificate to the backend (this is how Conjur Enterprise works)
        proxy_set_header X-SSL-Client-Certificate $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Certificate-Raw $ssl_client_raw_cert;
        proxy_set_header Host $host;
    }

    # v2 API path (Conjur Cloud)
    location /api/authn-cert/ {
        proxy_pass http://conjur-mock:8080;

        proxy_set_header X-SSL-Client-Certificate $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Certificate-Raw $ssl_client_raw_cert;
        proxy_set_header Host $host;
    }

    # Resources and secrets — token auth (no mTLS required by Conjur for these)
    location /resources/ {
        proxy_pass http://conjur-mock:8080;
        proxy_set_header Host $host;
    }

    location /secrets/ {
        proxy_pass http://conjur-mock:8080;
        proxy_set_header Host $host;
    }

    location /api/resources/ {
        proxy_pass http://conjur-mock:8080;
        proxy_set_header Host $host;
    }

    location /api/secrets/ {
        proxy_pass http://conjur-mock:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://conjur-mock:8080;
        proxy_set_header Host $host;
    }
}
