services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins.disco
    container_name: jenkins
    ports:
      - "8080:8080"
      - "5005:5005"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - disco-e2e
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false ${JENKINS_DEBUG_OPTS:-}
      - JAVA_ARGS=-Djavax.net.ssl.trustStore=/opt/java/openjdk/lib/security/cacerts
      - CYBERARK_DISCO_ENV=${CYBERARK_DISCO_ENV:-INTEGRATION}
      - JENKINS_ADMIN_ID=${JENKINS_ADMIN_ID:-admin}
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:-}

  playwright:
    build:
      context: ..
      dockerfile: Dockerfile.playwright
    depends_on:
      - jenkins
    networks:
      - disco-e2e
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ${HOME}/.m2/repository:/root/.m2/repository
    environment:
      - JENKINS_URL=${JENKINS_URL:-http://jenkins:8080}
      - JENKINS_CLI_AUTH=${JENKINS_CLI_AUTH:-}
      - DISCO_TENANT_ID=${DISCO_TENANT_ID:-}
      - DISCO_SUBDOMAIN=${DISCO_SUBDOMAIN:-}
      - DISCO_IDENTITY_URL=${DISCO_IDENTITY_URL:-}
      - DISCO_GRAPHQL_URL=${DISCO_GRAPHQL_URL:-}
      - DISCO_USERNAME=${DISCO_USERNAME:-}
      - DISCO_PASSWORD=${DISCO_PASSWORD:-}
      - DISCO_SECRETS_URL=${DISCO_SECRETS_URL:-}
      - DISCO_GRAPHQL_RUN=${DISCO_GRAPHQL_RUN:-true}
      - DISCO_E2E_TEST_SELECTOR=${DISCO_E2E_TEST_SELECTOR:-org.conjur.jenkins.disco.e2e.tests.Disco*}
    command: >
      mvn test
      -Dtest=${DISCO_E2E_TEST_SELECTOR:-org.conjur.jenkins.disco.e2e.tests.Disco*}
      -DfailIfNoTests=false

networks:
  disco-e2e:
    name: ${DISCO_DOCKER_NETWORK:-conjur-credentials-disco}
