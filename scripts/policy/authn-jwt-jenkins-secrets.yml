- &FreestyleJob
 - !variable freestyle-job-credential1
 - !variable freestyle-job-credential2

 # secrets-users can read and execute
- !permit
  resource: *FreestyleJob
  privileges: [ read, execute ]
  roles: !host jenkins/projects/freestyle-job-with-jwt


