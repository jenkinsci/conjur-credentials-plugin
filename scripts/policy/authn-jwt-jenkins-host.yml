# conjur policy load jenkins projects.yml

- !policy
  id: jenkins
  body:
    - !policy
      id: projects
      annotations:
        description: Projects that do not fall under a folder within Jenkins or project-specific host identities for authn-jwt/jenkins authentication.
        jenkins: true
      body:
 
        # Group of hosts that can authenticate using this JWT Authenticator
        - !group

        - !host
          id: freestyle-job-with-jwt
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: freestyle-job-with-jwt
            authn-jwt/identity: freestyle-job-with-jwt
        
        - !host
          id: pipeline-job-with-jwt
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: pipeline-job-with-jwt
            authn-jwt/identity: pipeline-job-with-jwt

        - !host
          id: folder-job
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job
            authn-jwt/identity: folder-job

        - !host
          id: folder-pipeline-job-with-jwt
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job/folder-pipeline-job-with-jwt
            authn-jwt/identity: folder-job/folder-pipeline-job-with-jwt

        - !host
          id: subfolder
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job/subfolder
            authn-jwt/identity: folder-job/subfolder

        - !host
          id: subchildfolder
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job/subfolder/subchildfolder
            authn-jwt/identity: folder-job/subfolder/subchildfolder

        - !host
          id: subfolder-pipeline-job-with-jwt
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job/subfolder/subfolder-pipeline-job-with-jwt
            authn-jwt/identity: folder-job/subfolder/subfolder-pipeline-job-with-jwt

        - !host
          id: subchild-freestyle-job-with-jwt
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Build
            authn-jwt/jenkins/jenkins_full_name: folder-job/subfolder/subchildfolder/subchild-freestyle-job-with-jwt
            authn-jwt/identity: folder-job/subfolder/subchildfolder/subchild-freestyle-job-with-jwt

        - !host
          id: multibranchtesting
          annotations:
            authn-jwt/jenkins/jenkins_task_noun: Scan
            authn-jwt/jenkins/jenkins_full_name: multibranchtesting
            authn-jwt/identity: multibranchtesting

        # Grant all hosts in collection above to be members of projects group
        - !grant
          role: !group
          members:
            - !host freestyle-job-with-jwt
            - !host pipeline-job-with-jwt
            - !host folder-job
            - !host folder-pipeline-job-with-jwt
            - !host subfolder
            - !host subchildfolder
            - !host subfolder-pipeline-job-with-jwt
            - !host subchild-freestyle-job-with-jwt
            - !host multibranchtesting


                    
# Grant access to Conjur secrets for user role     

- !grant
  role: !group conjur/authn-jwt/jenkins/consumers
  members: 
    - !group jenkins/projects
