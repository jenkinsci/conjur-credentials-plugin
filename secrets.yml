# Summon mapping for live DisCo E2E runs.
# Usage examples:
#   summon -p summon-conjur ./scripts/start.sh --disco-only
#   summon -p summon-conjur ./scripts/validate_disco_secrets.sh
#
# The values are injected as environment variables consumed by the DisCo E2E scripts.
DISCO_USERNAME: !var ci/conjur-cloud-tenant/disco/username
DISCO_TENANT_ID: !var ci/conjur-cloud-tenant/disco/tenant-id
DISCO_SUBDOMAIN: !var ci/conjur-cloud-tenant/disco/subdomain
DISCO_IDENTITY_URL: !var ci/conjur-cloud-tenant/disco/identity-url
DISCO_GRAPHQL_URL: !var ci/conjur-cloud-tenant/disco/graphql-url
DISCO_PASSWORD: !var ci/conjur-cloud-tenant/system/secrets/admin/password
JENKINS_ADMIN_PASSWORD: !var ci/conjur-cloud-tenant/system/secrets/admin/password
